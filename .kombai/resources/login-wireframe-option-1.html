<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page - Option 1: Centered Card with Top Branding</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 420px;
        }
        .branding {
            text-align: center;
            margin-bottom: 40px;
        }
        .logo-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .logo {
            width: 48px;
            height: 48px;
            background: linear-gradient(90deg, #1E40AF 0%, #3D5A7D 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .app-name {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(90deg, #4B6BA6 0%, #2D3F5F 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            font-size: 13px;
            color: #6B7280;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 8px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid #e5e7eb;
        }
        .card-header {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 2px solid #EEF1F7;
        }
        .card-title {
            font-size: 24px;
            font-weight: 700;
            color: #1F2937;
            margin-bottom: 4px;
        }
        .card-subtitle {
            font-size: 14px;
            color: #9CA3AF;
            font-weight: 500;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #1F2937;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            background: white;
            transition: all 0.2s;
        }
        .input:focus {
            outline: none;
            border-color: #4B6BA6;
            box-shadow: 0 0 0 3px rgba(75, 107, 166, 0.15);
        }
        .button {
            width: 100%;
            padding: 12px 16px;
            background: linear-gradient(90deg, #4B6BA6 0%, #3D5A7D 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(75, 107, 166, 0.3);
        }
        .toggle {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
            font-size: 13px;
            color: #6B7280;
        }
        .toggle a {
            color: #4B6BA6;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .accent-line {
            height: 3px;
            width: 60px;
            background: linear-gradient(90deg, #4B6BA6 0%, #EEF1F7 100%);
            margin: 0 auto 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Branding Section -->
        <div class="branding">
            <div class="logo-section">
                <div class="logo">🔐</div>
                <div class="app-name">IPS TestLAB</div>
            </div>
            <div class="subtitle">Système de Gestion d'Inventaire</div>
        </div>

        <!-- Login Card -->
        <div class="card">
            <div class="card-header">
                <div class="accent-line"></div>
                <h1 class="card-title">Connexion</h1>
                <p class="card-subtitle">Accédez à votre compte</p>
            </div>

            <form>
                <div class="form-group">
                    <label class="label">📧 Email Professionnel</label>
                    <input type="email" class="input" placeholder="name@company.com" required>
                </div>

                <div class="form-group">
                    <label class="label">🔒 Mot de Passe</label>
                    <input type="password" class="input" placeholder="••••••••" required>
                </div>

                <button type="submit" class="button">Se Connecter</button>
            </form>

            <div class="toggle">
                Pas de compte ? <a href="#">S'inscrire</a>
            </div>
        </div>
    </div>
</body>
</html>
