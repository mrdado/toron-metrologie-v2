<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Option 3: Hero Scanner - Wireframe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Marker Felt', cursive;
            background: #f5f5f5;
            padding: 20px;
            color: #333;
        }

        .wireframe-container {
            max-width: 480px;
            margin: 0 auto;
            background: white;
            padding: 0;
            border: 3px solid #333;
        }

        .wireframe-title {
            font-size: 20px;
            margin: 20px;
            text-align: center;
            font-weight: bold;
            border-bottom: 2px solid #ccc;
            padding-bottom: 10px;
        }

        /* Top Navigation with Stats */
        .top-nav {
            border-bottom: 2px solid #666;
            padding: 12px 15px 8px;
            background: #fff;
        }

        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-box {
            width: 32px;
            height: 32px;
            border: 2px solid #333;
            background: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
        }

        .logo-text {
            font-size: 14px;
            font-weight: bold;
        }

        .logout-btn {
            width: 28px;
            height: 28px;
            border: 2px solid #666;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }

        /* Minimal Stats in Nav */
        .nav-stats {
            display: flex;
            gap: 8px;
            padding: 8px 0;
        }

        .nav-stat {
            flex: 1;
            background: #f5f5f5;
            border: 1px solid #ddd;
            padding: 6px 8px;
            text-align: center;
            font-size: 10px;
        }

        .nav-stat-number {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .nav-stat.alert {
            background: #fff0f0;
            border-color: #fcc;
        }

        .nav-stat.alert .nav-stat-number {
            color: #d00;
        }

        /* Content Area */
        .content {
            padding: 20px 15px;
        }

        /* Hero Scanner */
        .hero-scanner {
            border: 4px solid #333;
            padding: 30px 20px;
            text-align: center;
            background: #333;
            color: white;
            margin-bottom: 20px;
        }

        .hero-icon {
            width: 60px;
            height: 60px;
            border: 3px solid white;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .hero-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .hero-subtitle {
            font-size: 12px;
            color: #ccc;
        }

        /* Quick Actions Grid */
        .quick-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .quick-action {
            border: 2px solid #666;
            padding: 18px 12px;
            text-align: center;
            background: white;
        }

        .quick-icon {
            width: 36px;
            height: 36px;
            border: 2px solid #333;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e0e0e0;
            font-size: 16px;
        }

        .quick-label {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 3px;
        }

        .quick-count {
            font-size: 10px;
            color: #999;
        }

        /* Management Links */
        .manage-links {
            border-top: 1px solid #ddd;
            padding-top: 15px;
        }

        .manage-link {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 10px;
            margin-bottom: 8px;
            border: 1px solid #ccc;
            background: #fafafa;
        }

        .manage-link-text {
            font-size: 14px;
        }

        .manage-arrow {
            font-size: 12px;
            color: #999;
        }

        /* Tag Badge */
        .tag {
            position: absolute;
            top: 4px;
            right: 4px;
            padding: 4px 8px;
            font-size: 10px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            z-index: 10;
            border-radius: 3px;
        }

        .tag-reuse {
            background: #4CAF50;
            color: white;
        }

        .tag-new {
            background: #FF9800;
            color: white;
        }
    </style>
</head>
<body>
    <div class="wireframe-container">
        <h1 class="wireframe-title">Option 3: Hero Scanner</h1>

        <!-- Top Navigation with Minimal Stats -->
        <!-- REUSABLE: HomeLayout from src/components/layout/HomeLayout.jsx -->
        <div style="position: relative;">
            <span class="tag tag-reuse" title="src/components/layout/HomeLayout.jsx">[REUSE] HomeLayout</span>
            <div class="top-nav">
                <div class="nav-header">
                    <div class="logo-area">
                        <div class="logo-box">T</div>
                        <div class="logo-text">Toron Metrologie</div>
                    </div>
                    <div class="logout-btn">[X]</div>
                </div>
                
                <!-- NEW COMPONENT: MinimalStats (to be created at src/components/ui/MinimalStats.jsx) -->
                <div style="position: relative;">
                    <span class="tag tag-new" title="To be created at src/components/ui/MinimalStats.jsx" style="top: -25px; right: -10px;">[NEW] MinimalStats</span>
                    <div class="nav-stats">
                        <div class="nav-stat">
                            <div class="nav-stat-number">142</div>
                            <div>Torons</div>
                        </div>
                        <div class="nav-stat">
                            <div class="nav-stat-number">68</div>
                            <div>Équip.</div>
                        </div>
                        <div class="nav-stat alert">
                            <div class="nav-stat-number">7</div>
                            <div>Exp.</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Content Area -->
        <div class="content">
            <!-- Hero Scanner Button -->
            <!-- REUSABLE: Button from src/components/ui/Button.jsx -->
            <div style="position: relative;">
                <span class="tag tag-reuse" title="src/components/ui/Button.jsx">[REUSE] Button</span>
                <div class="hero-scanner">
                    <div class="hero-icon">[QR]</div>
                    <div class="hero-title">Scanner QR Code</div>
                    <div class="hero-subtitle">Appuyez pour démarrer</div>
                </div>
            </div>

            <!-- Quick Actions Grid -->
            <div class="quick-actions">
                <div class="quick-action">
                    <div class="quick-icon">[T+]</div>
                    <div class="quick-label">Nouveau Toron</div>
                    <div class="quick-count">142 total</div>
                </div>

                <div class="quick-action">
                    <div class="quick-icon">[E+]</div>
                    <div class="quick-label">Nouvel Équipement</div>
                    <div class="quick-count">68 total</div>
                </div>
            </div>

            <!-- Management Links -->
            <div class="manage-links">
                <div class="manage-link">
                    <div class="manage-link-text">Gérer Torons</div>
                    <div class="manage-arrow">→</div>
                </div>

                <div class="manage-link">
                    <div class="manage-link-text">Gérer Équipements</div>
                    <div class="manage-arrow">→</div>
                </div>

                <div class="manage-link" style="border-color: #fcc; background: #fff5f5;">
                    <div class="manage-link-text" style="color: #d00;">⚠ Calibrations Expirées (7)</div>
                    <div class="manage-arrow" style="color: #d00;">→</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
